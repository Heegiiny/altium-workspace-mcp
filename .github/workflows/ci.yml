name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build AltiumWorkspaceMCP.sln -c Release
      - name: Test
        run: dotnet test tests/AltiumWorkspaceMCP.Tests -c Release --no-build
